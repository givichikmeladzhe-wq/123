# CI verification probe for execution-proof PR
name: Execution Enforcement

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'schema/**'
      - 'scripts/**'
      - '.github/workflows/execution-enforcement.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'schema/**'
      - 'scripts/**'
      - '.github/workflows/execution-enforcement.yml'

jobs:
  execution-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full AI OS test suite
        run: python -m unittest discover -s tests -v
      - name: Run persistent execution smoke
        run: python scripts/execution_smoke.py
      - name: Run bridge proof
        run: python scripts/bridge_proof.py
